<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - Space UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
      background: radial-gradient(circle at center, #000010, #000);
      color: white;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    #status {
      font-size: 14px;
      color: #aaa;
    }

    #chat {
      position: absolute;
      top: 50px;
      width: 100%;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      padding: 12px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
      animation: float 6s infinite ease-in-out;
      max-width: 200px;
      word-wrap: break-word;
    }

    .you {
      background: rgba(0,255,170,0.2);
      box-shadow: 0 0 20px #00ffaa;
    }

    .stranger {
      background: rgba(255,255,255,0.1);
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }

    .input-box {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 5px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00ffaa;
      color: black;
      font-weight: bold;
    }

    button:last-child {
      background: #ff4d4d;
    }
  </style>
</head>

<body>

<header>
  🚀 Space Chat  
  <div id="status">Connecting...</div>
</header>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Send a signal..." />
  <button onclick="sendMsg()">Send</button>
  <button onclick="nextUser()">Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "🛰 Searching...";
});

socket.on("connected", () => {
  status.innerText = "🌌 Connected";
});

socket.on("receive-message", (msg) => {
  createBubble(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "🚫 Lost signal...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  createBubble(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function createBubble(text, type) {
  const div = document.createElement("div");
  div.classList.add("bubble", type);
  div.innerText = text;

  // Random position
  div.style.left = Math.random() * 70 + "%";
  div.style.top = Math.random() * 70 + "%";

  chat.appendChild(div);
}
</script>

</body>
</html>
