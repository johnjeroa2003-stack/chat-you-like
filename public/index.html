<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like</title>

  <!-- IMPORTANT for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      margin: 10px;
      font-size: 20px;
      text-align: center;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 70%;
      padding: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .you {
      align-self: flex-end;
      background: #4CAF50;
    }

    .stranger {
      align-self: flex-start;
      background: #333;
    }

    .input-box {
      display: flex;
      padding: 10px;
      background: #222;
      gap: 5px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #4CAF50;
      color: white;
    }

    button:last-child {
      background: #f44336;
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      h1 {
        font-size: 16px;
      }

      input {
        font-size: 14px;
      }

      button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<h1>🔥 Chat You Like</h1>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
  <button onclick="nextUser()">Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "✅ Connected to stranger";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left. Finding new...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("msg", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>

<!-- Add this inside <body>, ABOVE your chat div -->
<canvas id="three-canvas" style="position:absolute; top:0; left:0; z-index:0;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<script>
  const canvas = document.getElementById("three-canvas");
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Camera & Controls
  camera.position.set(0,2,5);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableZoom = false;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(5,10,5);
  scene.add(light);

  // Rotating environment (cube)
  const room = new THREE.Mesh(
    new THREE.BoxGeometry(10,10,10),
    new THREE.MeshStandardMaterial({ color: 0x222244, side: THREE.BackSide })
  );
  scene.add(room);

  // Chat bubbles
  const bubbleMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffaa });
  const bubbles = [];

  function create3DBubble(msg) {
    const geometry = new THREE.SphereGeometry(0.2,16,16);
    const bubble = new THREE.Mesh(geometry, bubbleMaterial);
    bubble.position.set((Math.random()-0.5)*4, Math.random()*3+1, (Math.random()-0.5)*4);
    bubble.userData = { msg };
    scene.add(bubble);
    bubbles.push(bubble);
  }

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    room.rotation.y += 0.001;
    const time = Date.now()*0.001;
    bubbles.forEach(b => b.position.y += 0.002 * Math.sin(time));
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Connect chat messages to 3D
  function add3DBubbleFromMsg(msg) {
    create3DBubble(msg);
  }

  // Replace your addMessage() call with 3D bubble creation
  const originalAddMessage = addMessage;
  addMessage = function(msg, type) {
    originalAddMessage(msg,type);
    add3DBubbleFromMsg(msg);
  };

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
