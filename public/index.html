<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    #chat {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #444;
      margin: 20px;
      padding: 10px;
      background: #222;
    }

    .input-box {
      position: fixed;
      bottom: 10px;
      width: 100%;
    }

    input {
      width: 60%;
      padding: 10px;
    }

    button {
      padding: 10px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

<h1>🔥 Chat You Like</h1>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
  <button onclick="nextUser()">Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "✅ Connected to stranger";
});

socket.on("receive-message", (msg) => {
  addMessage("Stranger: " + msg);
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left. Finding new...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage("You: " + msg);
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg) {
  const div = document.createElement("div");
  div.innerText = msg;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
