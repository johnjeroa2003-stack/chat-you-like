<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - WhatsApp UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #0f172a;
      color: white;
    }

    /* LEFT SIDEBAR */
    #sidebar {
      width: 30%;
      background: #111827;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    #sidebar h2 {
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    #users {
      flex: 1;
      overflow-y: auto;
    }

    .user {
      padding: 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .user:hover {
      background: #1f2937;
    }

    /* RIGHT CHAT */
    #chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 10px;
      background: #111827;
      border-bottom: 1px solid #333;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
    }

    .you {
      align-self: flex-end;
      background: #22c55e;
      color: black;
    }

    .other {
      align-self: flex-start;
      background: #374151;
    }

    #input-box {
      display: flex;
      padding: 10px;
      background: #111827;
    }

    #input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    #input-box button {
      margin-left: 5px;
      padding: 10px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #sidebar { width: 40%; }
      #chat-area { width: 60%; }
    }
  </style>
</head>

<body>

<!-- LEFT SIDE -->
<div id="sidebar">
  <h2>Online Users</h2>
  <div id="users"></div>
</div>

<!-- RIGHT SIDE -->
<div id="chat-area">
  <div id="chat-header">Select a user</div>
  <div id="chat"></div>

  <div id="input-box">
    <input id="msg" placeholder="Type message..." />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

// ✅ USERNAME
let username = localStorage.getItem("username");

if (!username) {
  username = prompt("Enter your username:");
  localStorage.setItem("username", username);
}

// REGISTER USER
socket.emit("register", username);

let currentChatUser = null;
let onlineUsers = [];

const chat = document.getElementById("chat");
const header = document.getElementById("chat-header");

// 🔥 RECEIVE ONLINE USERS
socket.on("online-users", (users) => {
  onlineUsers = users.filter(u => u !== username);
  renderUsers();
});

// 🔥 RECEIVE MESSAGE
socket.on("receive-private-message", (data) => {
  if (data.from === currentChatUser) {
    addMessage(data.msg, "other");
  }
});

// SEND MESSAGE
function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (!msg.trim()) return;

  if (!currentChatUser) {
    alert("⚠️ Select a user first");
    return;
  }

  const fullMsg = username + ": " + msg;

  addMessage(fullMsg, "you");

  socket.emit("private-message", {
    to: currentChatUser,
    msg: fullMsg
  });

  input.value = "";
}

// ADD MESSAGE
function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("msg", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// RENDER ONLINE USERS
function renderUsers() {
  const box = document.getElementById("users");
  box.innerHTML = "";

  onlineUsers.forEach((user) => {
    const div = document.createElement("div");
    div.classList.add("user");
    div.innerText = "🟢 " + user;

    div.onclick = () => {
      currentChatUser = user;
      chat.innerHTML = "";
      header.innerText = "Chat with " + user;
    };

    box.appendChild(div);
  });
}

// ENTER KEY SEND
document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMsg();
  }
});
</script>

</body>
</html>
