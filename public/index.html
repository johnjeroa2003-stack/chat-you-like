<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - New UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle, #1a1a1a, #000);
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      padding: 10px;
      font-size: 18px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    #status {
      text-align: center;
      font-size: 14px;
      margin: 5px;
      color: #aaa;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }

    .card {
      max-width: 80%;
      padding: 15px;
      border-radius: 15px;
      background: #222;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: floatIn 0.4s ease;
      text-align: center;
    }

    .you {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .stranger {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
    }

    @keyframes floatIn {
      from {
        transform: translateY(50px) scale(0.8);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .input-box {
      display: flex;
      padding: 10px;
      gap: 5px;
      background: #111;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      cursor: pointer;
    }

    button:last-child {
      background: #ff4d4d;
    }
  </style>
</head>

<body>

<header>🚀 Chat You Like - New UI</header>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
  <button onclick="nextUser()">Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "🔥 Connected";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("card", type);
  div.innerText = msg;

  chat.appendChild(div);
}
</script>

</body>
</html>
