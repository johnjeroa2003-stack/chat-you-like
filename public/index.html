<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - 3D UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      overflow: hidden;
      background: black;
      color: white;
    }

    /* 🌌 Animated Background */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(white 1px, transparent 1px);
      background-size: 40px 40px;
      animation: moveBg 20s linear infinite;
      opacity: 0.1;
    }

    @keyframes moveBg {
      from { transform: translate(0,0); }
      to { transform: translate(-200px,-200px); }
    }

    header {
      text-align: center;
      padding: 12px;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #333;
      position: relative;
      z-index: 1;
    }

    #status {
      text-align: center;
      font-size: 13px;
      padding: 5px;
      color: #aaa;
      position: relative;
      z-index: 1;
    }

    #chat {
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* 💬 Glass Chat Bubble */
    .message {
      max-width: 70%;
      padding: 12px 16px;
      margin: 6px 0;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
      animation: floatIn 0.3s ease;
    }

    .you {
      align-self: flex-end;
      background: rgba(0, 255, 200, 0.2);
      box-shadow: 0 0 10px #00ffc3;
    }

    .stranger {
      align-self: flex-start;
      background: rgba(255, 100, 100, 0.2);
      box-shadow: 0 0 10px #ff4d4d;
    }

    @keyframes floatIn {
      from {
        transform: translateY(20px) scale(0.9);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .input-box {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      gap: 5px;
      z-index: 1;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 50%;
      background: #00ffc3;
      color: black;
      cursor: pointer;
    }

    button:last-child {
      background: #ff4d4d;
      color: white;
    }
  </style>
</head>

<body>

<header>🌌 Chat You Like - Future UI</header>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">➤</button>
  <button onclick="nextUser()">⏭</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Searching user...";
});

socket.on("connected", () => {
  status.innerText = "🔥 Connected";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("message", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
