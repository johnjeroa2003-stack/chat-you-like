<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - Ultra Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    #particles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: black;
    }

    header {
      text-align: center;
      padding: 12px;
      font-size: 18px;
      background: rgba(0,0,0,0.4);
    }

    #status {
      text-align: center;
      font-size: 13px;
      padding: 5px;
      color: #aaa;
    }

    #chat {
      margin-left: 130px;
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
    }

    .you {
      align-self: flex-end;
      background: rgba(0,255,200,0.3);
    }

    .stranger {
      align-self: flex-start;
      background: rgba(255,100,100,0.3);
    }

    #friends {
      position: fixed;
      left: 0;
      top: 80px;
      width: 120px;
      height: 70%;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      padding: 10px;
    }

    .input-box {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      gap: 5px;
      background: rgba(0,0,0,0.5);
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    button {
      padding: 10px;
      border-radius: 50%;
      border: none;
      background: #00ffc3;
    }
  </style>
</head>

<body>

<div id="particles"></div>

<div id="friends"><b>Friends</b></div>

<header>🚀 Chat You Like - Ultra</header>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">➤</button>
  <button onclick="nextUser()">⏭</button>
  <button onclick="joinRoom()">🔒</button>
  <button onclick="sendFriend()">🤝</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const username = localStorage.getItem("username");

if (!username) {
  window.location.href = "/login.html";
}

socket.emit("register", username);

let friends = [];
let currentChatUser = null;
let currentRoom = null;

const chat = document.getElementById("chat");
const status = document.getElementById("status");

// ---------------- CHAT ----------------
socket.on("waiting", () => status.innerText = "⏳ Waiting...");
socket.on("connected", () => status.innerText = "🔥 Connected");

socket.on("receive-message", (msg) => {
  if (!currentChatUser) addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left";
});

// ---------------- FRIEND SYSTEM ----------------
socket.on("friend-request", (fromUser) => {
  const accept = confirm(fromUser + " sent you a friend request");

  if (accept) {
    socket.emit("accept-friend", fromUser);
  }
});

socket.on("friend-accepted", (user) => {
  alert(user + " is now your friend 🎉");
  friends.push(user);
  renderFriends();
});

// ---------------- PRIVATE CHAT ----------------
socket.on("receive-private-message", (data) => {
  if (currentChatUser === data.from) {
    addMessage(data.msg, "stranger");
  }
});

// ---------------- FUNCTIONS ----------------
function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (!msg.trim()) return;

  const fullMsg = username + ": " + msg;

  addMessage(fullMsg, "you");

  if (currentChatUser) {
    socket.emit("private-message", {
      to: currentChatUser,
      msg: fullMsg
    });
  } 
  else if (currentRoom) {
    socket.emit("private-message", {
      to: currentRoom,
      msg: fullMsg
    });
  } 
  else {
    socket.emit("send-message", fullMsg);
  }

  input.value = "";
}

function nextUser() {
  currentChatUser = null;
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("message", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function joinRoom() {
  const roomId = prompt("Enter Room ID:");
  if (!roomId) return;

  currentRoom = roomId;
  currentChatUser = null;

  chat.innerHTML = "";
  status.innerText = "🔒 Room: " + roomId;
}

function sendFriend() {
  const name = prompt("Enter username:");
  if (!name) return;

  socket.emit("send-friend-request", name);
}

function renderFriends() {
  const box = document.getElementById("friends");
  box.innerHTML = "<b>Friends</b>";

  friends.forEach((f) => {
    const div = document.createElement("div");
    div.innerText = f;
    div.style.cursor = "pointer";

    div.onclick = () => {
      currentChatUser = f;
      currentRoom = null;
      chat.innerHTML = "";
      status.innerText = "💬 Chat with " + f;
    };

    box.appendChild(div);
  });
}

// ---------------- PARTICLES ----------------
tsParticles.load("particles", {
  particles: {
    number: { value: 80 },
    color: { value: "#00ffc3" },
    links: { enable: true, color: "#00ffc3", distance: 120 },
    move: { enable: true, speed: 2 }
  }
});
</script>

</body>
</html>
