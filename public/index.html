<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - Live Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #0f172a;
      color: white;
    }

    #sidebar {
      width: 30%;
      background: #111827;
      display: flex;
      flex-direction: column;
    }

    #sidebar h2 {
      text-align: center;
      padding: 10px;
    }

    #users {
      flex: 1;
      overflow-y: auto;
    }

    .user {
      padding: 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .user:hover {
      background: #1f2937;
    }

    #chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 10px;
      background: #111827;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
    }

    .you {
      align-self: flex-end;
      background: #22c55e;
      color: black;
    }

    .other {
      align-self: flex-start;
      background: #374151;
    }

    #input-box {
      display: flex;
      padding: 10px;
      background: #111827;
    }

    #input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
    }

    #input-box button {
      margin-left: 5px;
      padding: 10px;
      border-radius: 50%;
      background: #22c55e;
      border: none;
    }
  </style>
</head>

<body>

<!-- LEFT -->
<div id="sidebar">
  <h2>Online Users</h2>
  <div id="users"></div>
</div>

<!-- RIGHT -->
<div id="chat-area">
  <div id="chat-header">Select user</div>
  <div id="chat"></div>

  <div id="input-box">
    <input id="msg" placeholder="Type message..." />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const username = localStorage.getItem("username");

if (!username) {
  const name = prompt("Enter your username");
  localStorage.setItem("username", name);
  location.reload();
}

// REGISTER
socket.emit("register", username);

let currentUser = null;

const chat = document.getElementById("chat");
const header = document.getElementById("chat-header");

// ----------------------
// 🟢 ONLINE USERS
// ----------------------
socket.on("online-users", (userList) => {
  const box = document.getElementById("users");
  box.innerHTML = "";

  userList.forEach((user) => {
    if (user === username) return;

    const div = document.createElement("div");
    div.className = "user";
    div.innerText = user;

    div.onclick = () => {
      currentUser = user;
      header.innerText = "Chat with " + user;
      chat.innerHTML = "";
    };

    box.appendChild(div);
  });
});

// ----------------------
// 💬 RECEIVE MESSAGE
// ----------------------
socket.on("receive-private-message", (data) => {
  if (data.from === currentUser) {
    addMessage(data.msg, "other");
  }
});

// ----------------------
// 📤 SEND MESSAGE
// ----------------------
function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (!msg.trim()) return;

  if (!currentUser) {
    alert("Select a user first");
    return;
  }

  const fullMsg = username + ": " + msg;

  addMessage(fullMsg, "you");

  socket.emit("private-message", {
    to: currentUser,
    msg: fullMsg
  });

  input.value = "";
}

// ENTER KEY
document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMsg();
});

// ----------------------
function addMessage(msg, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
