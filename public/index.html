<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #0f172a;
      color: white;
    }

    #sidebar {
      width: 30%;
      background: #111827;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    #sidebar h2 {
      text-align: center;
      padding: 10px;
    }

    #users {
      flex: 1;
      overflow-y: auto;
    }

    .user {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid #222;
    }

    .user:hover {
      background: #1f2937;
    }

    #chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 10px;
      background: #111827;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      position: relative;
    }

    .you {
      align-self: flex-end;
      background: #22c55e;
      color: black;
    }

    .other {
      align-self: flex-start;
      background: #374151;
    }

    .tick {
      font-size: 12px;
      position: absolute;
      bottom: 3px;
      right: 8px;
    }

    #input-box {
      display: flex;
      padding: 10px;
      background: #111827;
    }

    #input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    #input-box button {
      margin-left: 5px;
      padding: 10px;
      border-radius: 50%;
      border: none;
      background: #22c55e;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="sidebar">
  <h2>Online</h2>
  <div id="users"></div>
</div>

<div id="chat-area">
  <div id="chat-header">Select user</div>
  <div id="chat"></div>

  <div id="input-box">
    <input id="msg" placeholder="Type message..." />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let username = localStorage.getItem("username");

if (!username) {
  username = prompt("Enter username:");
  localStorage.setItem("username", username);
}

socket.emit("register", username);

let currentChatUser = null;
let onlineUsers = {};
let messageMap = {}; // id -> element

const chat = document.getElementById("chat");
const header = document.getElementById("chat-header");

// ONLINE USERS
socket.on("online-users", (users) => {
  renderUsers(users.filter(u => u !== username));
});

// RECEIVE MESSAGE
socket.on("receive-private-message", (data) => {
  addMessage(data.msg, "other");

  // send seen
  socket.emit("message-seen", {
    to: data.from,
    id: data.id
  });
});

// SEEN TICKS
socket.on("message-seen", ({ id }) => {
  const tick = messageMap[id];
  if (tick) tick.innerText = "✔✔";
});

// SEND MESSAGE
function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (!msg.trim()) return;
  if (!currentChatUser) return alert("Select user");

  const id = Date.now();

  const div = document.createElement("div");
  div.classList.add("msg", "you");
  div.innerText = msg;

  const tick = document.createElement("span");
  tick.classList.add("tick");
  tick.innerText = "✔";

  div.appendChild(tick);
  chat.appendChild(div);

  messageMap[id] = tick;

  socket.emit("private-message", {
    to: currentChatUser,
    msg: msg,
    id
  });

  input.value = "";
}

// ADD MESSAGE
function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("msg", type);
  div.innerText = msg;

  chat.appendChild(div);
}

// RENDER USERS
function renderUsers(users) {
  const box = document.getElementById("users");
  box.innerHTML = "";

  users.forEach(user => {
    const div = document.createElement("div");
    div.classList.add("user");
    div.innerText = "🟢 " + user;

    div.onclick = () => {
      currentChatUser = user;
      chat.innerHTML = "";
      header.innerText = "Chat with " + user;
    };

    box.appendChild(div);
  });
}

// ENTER KEY
document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMsg();
  }
});
</script>

</body>
</html>
