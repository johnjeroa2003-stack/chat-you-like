<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like</title>

  <!-- IMPORTANT for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      margin: 10px;
      font-size: 20px;
      text-align: center;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 70%;
      padding: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .you {
      align-self: flex-end;
      background: #4CAF50;
    }

    .stranger {
      align-self: flex-start;
      background: #333;
    }

    .input-box {
      display: flex;
      padding: 10px;
      background: #222;
      gap: 5px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #4CAF50;
      color: white;
    }

    button:last-child {
      background: #f44336;
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      h1 {
        font-size: 16px;
      }

      input {
        font-size: 14px;
      }

      button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<h1>🔥 Chat You Like</h1>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
  <button onclick="nextUser()">Next</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "✅ Connected to stranger";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left. Finding new...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("msg", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
