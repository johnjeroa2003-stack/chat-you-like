<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - Ultra Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 🔥 Particle Library -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    /* 🌌 3D Background */
    #particles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: black;
    }

    header {
      text-align: center;
      padding: 12px;
      font-size: 18px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #333;
    }

    #status {
      text-align: center;
      font-size: 13px;
      padding: 5px;
      color: #aaa;
    }

    #chat {
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    /* 💬 Chat bubbles */
    .message {
      max-width: 70%;
      padding: 12px 16px;
      margin: 6px 0;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.1);
      animation: floatIn 0.3s ease;
    }

    .you {
      align-self: flex-end;
      background: rgba(0, 255, 200, 0.3);
    }

    .stranger {
      align-self: flex-start;
      background: rgba(255, 100, 100, 0.3);
    }

    @keyframes floatIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* 📥 Input */
    .input-box {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      gap: 5px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 50%;
      background: #00ffc3;
      color: black;
      cursor: pointer;
    }

    button:last-child {
      background: #ff4d4d;
      color: white;
    }
  </style>
</head>

<body>

<!-- 🌌 3D Background -->
<div id="particles"></div>

<header>🚀 Chat You Like - Ultra</header>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">➤</button>
  <button onclick="nextUser()">⏭</button>
</div>

<!-- 🔌 Socket -->
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "🔥 Connected";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("message", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* 🌌 PARTICLE ENGINE */
tsParticles.load("particles", {
  background: { color: "#000" },
  particles: {
    number: { value: 80 },
    color: { value: "#00ffc3" },
    links: {
      enable: true,
      color: "#00ffc3",
      distance: 120
    },
    move: {
      enable: true,
      speed: 2
    },
    size: {
      value: 3
    }
  },
  interactivity: {
    events: {
      onHover: { enable: true, mode: "repulse" },
      onClick: { enable: true, mode: "push" }
    },
    modes: {
      repulse: { distance: 100 },
      push: { quantity: 4 }
    }
  }
});
</script>

</body>
</html>
