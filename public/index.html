<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - Pro UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b141a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      padding: 12px;
      font-size: 18px;
      background: #202c33;
      border-bottom: 1px solid #2a3942;
    }

    #status {
      text-align: center;
      font-size: 13px;
      padding: 5px;
      color: #8696a0;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      margin: 5px 0;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .you {
      align-self: flex-end;
      background: #005c4b;
      border-bottom-right-radius: 0;
    }

    .stranger {
      align-self: flex-start;
      background: #202c33;
      border-bottom-left-radius: 0;
    }

    .input-box {
      display: flex;
      padding: 10px;
      gap: 5px;
      background: #202c33;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: #2a3942;
      color: white;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:last-child {
      background: #ff4d4d;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<header>💬 Chat You Like</header>
<div id="status">Connecting...</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">➤</button>
  <button onclick="nextUser()">⏭</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const chat = document.getElementById("chat");
const status = document.getElementById("status");

socket.on("waiting", () => {
  status.innerText = "⏳ Waiting for stranger...";
});

socket.on("connected", () => {
  status.innerText = "✅ Connected";
});

socket.on("receive-message", (msg) => {
  addMessage(msg, "stranger");
});

socket.on("disconnected", () => {
  status.innerText = "❌ Stranger left...";
});

function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (msg.trim() === "") return;

  addMessage(msg, "you");
  socket.emit("send-message", msg);

  input.value = "";
}

function nextUser() {
  chat.innerHTML = "";
  socket.emit("next");
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("message", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
