<!DOCTYPE html>
<html>
<head>
  <title>Chat You Like - WhatsApp UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #0f172a;
      color: white;
    }

    /* LEFT SIDEBAR */
    #sidebar {
      width: 30%;
      background: #111827;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    #sidebar h2 {
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    #friends {
      flex: 1;
      overflow-y: auto;
    }

    .friend {
      padding: 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .friend:hover {
      background: #1f2937;
    }

    /* RIGHT CHAT */
    #chat-area {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    #chat-header {
      padding: 10px;
      background: #111827;
      border-bottom: 1px solid #333;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
    }

    .you {
      align-self: flex-end;
      background: #22c55e;
      color: black;
    }

    .other {
      align-self: flex-start;
      background: #374151;
    }

    #input-box {
      display: flex;
      padding: 10px;
      background: #111827;
    }

    #input-box input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    #input-box button {
      margin-left: 5px;
      padding: 10px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #sidebar { width: 40%; }
      #chat-area { width: 60%; }
    }
  </style>
</head>

<body>

<!-- LEFT SIDE -->
<div id="sidebar">
  <h2>Chats</h2>
  <div id="friends"></div>
  <button onclick="sendFriend()">➕ Add Friend</button>
</div>

<!-- RIGHT SIDE -->
<div id="chat-area">
  <div id="chat-header">Select a friend</div>
  <div id="chat"></div>

  <div id="input-box">
    <input id="msg" placeholder="Type message..." />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const username = localStorage.getItem("username");

if (!username) {
  window.location.href = "/login.html";
}

socket.emit("register", username);

let friends = [];
let currentChatUser = null;

const chat = document.getElementById("chat");
const header = document.getElementById("chat-header");

// ---------------- FRIEND SYSTEM ----------------
socket.on("friend-request", (fromUser) => {
  const accept = confirm(fromUser + " sent you a friend request");

  if (accept) {
    socket.emit("accept-friend", fromUser);
  }
});

socket.on("friend-accepted", (user) => {
  if (!friends.includes(user)) {
    friends.push(user);
    renderFriends();
  }
});

socket.on("accept-friend", (fromUser) => {
  const target = users[fromUser];

  if (target) {
    target.emit("friend-accepted", socket.username);

    // 🔥 ALSO SEND BACK (IMPORTANT)
    socket.emit("friend-accepted", fromUser);
  }
});

// ---------------- PRIVATE CHAT ----------------
socket.on("receive-private-message", (data) => {
  if (currentChatUser === data.from) {
    addMessage(data.msg, "other");
  }
});

// ---------------- FUNCTIONS ----------------
function sendMsg() {
  const input = document.getElementById("msg");
  const msg = input.value;

  if (!msg.trim() || !currentChatUser) return;

  const fullMsg = username + ": " + msg;

  addMessage(fullMsg, "you");

  socket.emit("private-message", {
    to: currentChatUser,
    msg: fullMsg
  });

  input.value = "";
}

function addMessage(msg, type) {
  const div = document.createElement("div");
  div.classList.add("msg", type);
  div.innerText = msg;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function renderFriends() {
  const box = document.getElementById("friends");
  box.innerHTML = "";

  friends.forEach((f) => {
    const div = document.createElement("div");
    div.classList.add("friend");
    div.innerText = f;

    div.onclick = () => {
      currentChatUser = f;
      chat.innerHTML = "";
      header.innerText = "Chat with " + f;
    };

    box.appendChild(div);
  });
}

function sendFriend() {
  const name = prompt("Enter username:");
  if (!name) return;

  socket.emit("send-friend-request", name);
}

document.getElementById("msg").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault(); // stops weird behavior
    sendMsg();
  }
});
</script>

</body>
</html>
