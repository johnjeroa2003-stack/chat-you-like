const socket = io();

// ✅ ADD HERE 👇
socket.on("friend-request", (fromUser) => {
  const accept = confirm(fromUser + " sent you a friend request");

  if (accept) {
    socket.emit("accept-friend", fromUser);
  }
});

socket.on("friend-accepted", (user) => {
  alert(user + " is now your friend 🎉");
});
