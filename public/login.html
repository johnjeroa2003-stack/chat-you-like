<!DOCTYPE html>
<html>
<head>
  <title>Login - Chat You Like</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial;
    }

    .box {
      background: #111827;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #22c55e;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Enter Chat</h2>

  <input id="name" placeholder="Username" />
  <input type="date" id="dob" />
  <select id="gender">
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <button onclick="enter()">Enter</button>
</div>

<script>
function enter() {
  const name = document.getElementById("name").value;
  const dob = document.getElementById("dob").value;
  const gender = document.getElementById("gender").value;

  if (!name || !dob || !gender) {
    alert("Fill all details");
    return;
  }

  // 👉 AGE CHECK
  const age = new Date().getFullYear() - new Date(dob).getFullYear();

  if (age < 18) {
    alert("❌ Only 18+ allowed");
    return;
  }

  // SAVE USER
  localStorage.setItem("username", name);

  // GO TO CHAT
  window.location.href = "/index.html";
}
</script>

</body>
</html>
