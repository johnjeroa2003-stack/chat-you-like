<!DOCTYPE html>
<html>
<head>
  <title>Login - Chat You Like</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #000, #1a1a1a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 350px;
      padding: 20px;
      background: #111;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .toggle {
      margin-top: 10px;
      font-size: 14px;
      cursor: pointer;
      color: #aaa;
    }

    .toggle:hover {
      color: white;
    }
  </style>
</head>

<body>

<div class="box">
  <h2 id="title">Login</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <div id="extra" style="display:none;">
    <input id="age" placeholder="Age">
    <input id="gender" placeholder="Gender">
  </div>

  <button onclick="submitForm()">Login</button>

  <div class="toggle" onclick="toggleMode()">
    Don't have an account? Register
  </div>
</div>

<script>
let isLogin = true;

function toggleMode() {
  isLogin = !isLogin;

  document.getElementById("title").innerText = isLogin ? "Login" : "Register";
  document.querySelector("button").innerText = isLogin ? "Login" : "Register";
  document.getElementById("extra").style.display = isLogin ? "none" : "block";
  document.querySelector(".toggle").innerText = isLogin 
    ? "Don't have an account? Register" 
    : "Already have an account? Login";
}

async function submitForm() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const age = document.getElementById("age").value;
  const gender = document.getElementById("gender").value;

  if (!username || !password) {
    alert("Fill all fields");
    return;
  }

  const url = isLogin ? "/login" : "/register";

  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ username, password, age, gender })
  });

  const data = await res.json();

  if (data.success) {
    alert(data.message || "Login success");

    // Save username
    localStorage.setItem("username", username);

    // Redirect to chat page
    window.location.href = "/";
  } else {
    alert(data.message);
  }
}
</script>

</body>
</html>
